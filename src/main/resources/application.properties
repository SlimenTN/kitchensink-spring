spring.application.name=kitchensink-spring
server.port=8081

# MongoDB (docker container kitchensink-mongo); password from mongodb/.env (KITCHENSINK_APP_PASSWORD)
spring.mongodb.uri=mongodb://kitchensink_app:${KITCHENSINK_MONGO_PASSWORD:}@localhost:27017/kitchensink?authSource=kitchensink

# CDC: embedded Debezium streams the legacy MySQL Member table into MongoDB
# password from mysql/.env (KITCHENSINK_CDC_PASSWORD); offsets + schema history are kept in state-directory
migration.cdc.enabled=true
migration.cdc.mysql.host=localhost
migration.cdc.mysql.port=3306
migration.cdc.mysql.user=kitchensink_cdc
migration.cdc.mysql.password=${KITCHENSINK_CDC_PASSWORD:}
migration.cdc.mysql.database=kitchensink
migration.cdc.mysql.table=Member
migration.cdc.mysql.server-id=5401
migration.cdc.state-directory=data/cdc

# Legacy MySQL database: new members are written there (source of truth during the migration), CDC copies them
# to MongoDB. Same user as the legacy app; password from mysql/.env (KITCHENSINK_MYSQL_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/kitchensink
spring.datasource.username=kitchensink_app
spring.datasource.password=${KITCHENSINK_MYSQL_PASSWORD:}

# Where new members are written: "legacy" = legacy MySQL database (CDC copies them to MongoDB), "new" = MongoDB.
# Switch to "new" only once ALL write traffic (REST and JSF page) goes to the new system. Reads always use MongoDB.
migration.write-store=legacy

# Members page texts: the legacy bundles (page texts + page messages); no fallback to the server language, so a
# language without its own file (e.g. en) uses the default file like the legacy page
spring.messages.basename=bundle/Resources,bundle/KitchensinkMessages
spring.messages.fallback-to-system-locale=false
